name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本 tag（例如 v0.5.1）'
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: 校验版本
        id: version
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
          git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
          TAG_TYPE="$(git cat-file -t "refs/tags/$TAG_NAME")"
          if [[ "$TAG_TYPE" != "tag" ]]; then
            echo "Release tag $TAG_NAME must be an annotated tag" >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "refs/tags/$TAG_NAME^{}")"
          if [[ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]]; then
            echo "Tag commit $TAG_COMMIT does not match checked-out commit $(git rev-parse HEAD)" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Tagged commit $TAG_COMMIT is not part of main" >&2
            exit 1
          fi
          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: git diff --exit-code
      - name: 生成发布包
        id: package
        run: |
          TARBALL="$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP")"
          echo "path=$RUNNER_TEMP/$TARBALL" >> "$GITHUB_OUTPUT"
      - name: 发布到本仓库 GitHub Release
        run: |
          RELEASE_ARGS=(
            "$TAG_NAME"
            "$TARBALL"
            --verify-tag
            --title "$TAG_NAME"
            --generate-notes
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "${RELEASE_ARGS[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          TARBALL: ${{ steps.package.outputs.path }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
